# Cloudflare Pages 项目配置(有了这个文件,Pages 以它为准,后台对应的栏目变成只读)。
# 构建命令照旧在 Cloudflare 后台:node scripts/build.mjs,输出 dist。
# 绑定:Workers AI(截图求助 /api/see 用);运营台的变量(见下)。正式环境和预览环境各写一遍,不靠「会不会继承」。
# 运营台(defiexit.com/admin/):只在 ADMIN_HOSTS 列的主机上应答;OPS_ENV 写进签名(预览的投递进不了正式库);
# INGEST_PUBKEYS 是 Claude 主窗口投递用的 Ed25519 公钥(公开的,可以写几把,换钥匙就改这里再发布);
# 第一次设管理员:维护者用签名投递送一个一次性的设置链接(24 小时内有效),不用在 Cloudflare 加机密;
# 也可以在 Cloudflare 加机密 SETUP_CODE(至少 16 位)代替。D1 数据库(绑定名 OPS)建好库再加。
name = "defiexit"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[env.preview.ai]
binding = "AI"

[env.production.ai]
binding = "AI"

[env.preview.vars]
OPS_ENV = "preview"
ADMIN_HOSTS = "ops.defiexit.pages.dev"
INGEST_PUBKEYS = "uU-sCviEOGst4OFy6aswMgZFtFNPVvKPUX6LQZi99l0"

[env.production.vars]
OPS_ENV = "production"
ADMIN_HOSTS = "defiexit.com"
INGEST_PUBKEYS = "Ab658gilbT2DCHplN4GUFyeiI1Oac9NAHFl6t7ooXTU"
